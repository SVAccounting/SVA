<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навчальна бухгалтерія</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#1f6feb;--bd:#dde1e8}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#95a0b5;--ac:#5b9bff;--bd:#2f3744}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1000px;margin:16px auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th{color:var(--mut);font-weight:600;font-size:13px}
tfoot td{font-weight:700}.err{color:#d33}.mut{color:var(--mut)}
</style></head><body>
<header><b>📒 Навчальна бухгалтерія</b>
<nav id="nav"></nav><span id="co" class="mut"></span></header>
<main id="app"></main>
<script src="templates.js"></script>
<script src="groups.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let accounts=[],company=null,tab='company',token=localStorage.getItem('token'),me=null,TASKS=[];
try{company=JSON.parse(localStorage.getItem('company')||'null')}catch{}
async function api(path,opt){
  const o={...(opt||{}),headers:{'content-type':'application/json'}};
  if(token)o.headers.authorization='Bearer '+token;
  if(opt&&opt.body)o.body=JSON.stringify(opt.body);
  const r=await fetch('/api/'+path,o),d=await r.json();
  if(r.status===401&&token){logout();throw new Error('Увійдіть знову')}
  if(!r.ok)throw new Error(d.error||'Помилка');return d;
}
const tabs={company:'Підприємство',entries:'Журнал операцій',add:'Нова операція',tpl:'Типові операції',osv:'Оборотно-сальдова відомість',rep:'Баланс і ФР',tasks:'Завдання',plan:'План рахунків'};
function nav(){
  if(!me)return;
  const hid=me.role==='teacher'?['add','tpl']:[];
  $('#nav').innerHTML=Object.entries(tabs).filter(([k])=>!hid.includes(k)).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('')+'<button onclick="logout()" style="margin-left:auto">Вийти</button>';
  $('#co').textContent=me.name+(me.role==='teacher'?' (викладач)':'')+(company?' · 🏢 '+company.name:'');
}
async function go(t){
  if(!['company','plan','tasks'].includes(t)&&!company){alert('Спочатку оберіть або створіть підприємство');t='company'}
  tab=t;nav();$('#app').innerHTML='<div class="card mut">Завантаження…</div>';
  try{await views[t]()}catch(e){$('#app').innerHTML=`<div class="card err">${esc(e.message)}</div>`}
}
const accOpts=()=>accounts.filter(a=>a.kind!=='O').map(a=>`<option value="${a.code}">${a.code} — ${esc(a.name)}</option>`).join('');
const views={
  async company(){
    const list=await api('companies');
    $('#app').innerHTML=`${me.role==='teacher'?'':`<div class="card"><h3>Нове підприємство</h3>
      <label>Назва (напр. «ТОВ Студент Іваненко, гр. 21»)</label><input id="cn">
      <p><button class="btn pri" onclick="addCo()">Створити</button></p></div>`}
      <div class="card sc"><h3>Обрати підприємство</h3><table><tbody>${list.map(c=>
      `<tr><td>${esc(c.name)}${c.owner?` <span class="mut">— ${esc(c.owner)}</span>`:''}</td><td><button class="btn ${company?.id===c.id?'pri':''}" onclick='pick(${c.id},${JSON.stringify(c.name)})'>${company?.id===c.id?'Обрано':'Обрати'}</button></td></tr>`).join('')}</tbody></table></div>`;
  },
  async entries(){
    const e=await api('entries?company_id='+company.id);
    $('#app').innerHTML=`<div class="card sc"><h3>Журнал операцій</h3><table><thead><tr><th>Дата</th><th>Документ</th><th>Зміст</th><th>Дт</th><th>Кт</th><th class="n">Сума</th><th></th></tr></thead><tbody>
    ${e.map(x=>`<tr><td>${x.date}</td><td>${esc(x.doc)}</td><td>${esc(x.description)}</td><td>${x.debit_acc}</td><td>${x.credit_acc}</td><td class="n">${fmt(x.amount)}</td><td>${me.role==='teacher'?'':`<button class="btn" onclick="del(${x.id})">✕</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Операцій ще немає</td></tr>'}</tbody></table></div>`;
  },
  async add(){
    $('#app').innerHTML=`<div class="card"><h3>Нова господарська операція</h3>
    <div class="row"><div><label>Дата</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label>Документ</label><input id="doc" placeholder="Накладна №1"></div>
    <div><label>Сума, грн</label><input id="amt" type="number" step="0.01" min="0.01"></div></div>
    <label>Зміст операції</label><input id="ds">
    <div class="row"><div><label>Дебет</label><select id="dt">${accOpts()}</select></div>
    <div><label>Кредит</label><select id="kt">${accOpts()}</select></div></div>
    <p><button class="btn pri" onclick="save()">Провести</button> <span id="msg" class="err"></span></p></div>`;
  },
  async tpl(){
    const cats=[...new Set(TPL.map(t=>t[0]))];
    $('#app').innerHTML=`<div class="card"><h3>Типова операція</h3><div class="row">
    <div><label>Операція</label><select id="tp" onchange="prev()">${cats.map(c=>`<optgroup label="${c}">${TPL.map((t,i)=>t[0]===c?`<option value="${i}">${esc(t[1])}</option>`:'').join('')}</optgroup>`).join('')}</select></div>
    <div><label>Дата</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label>Документ</label><input id="doc"></div>
    <div><label>Сума, грн</label><input id="amt" type="number" step="0.01" min="0" oninput="prev()"></div></div>
    <div class="sc" id="pv"></div><p><button class="btn pri" onclick="saveTpl()">Провести</button> <span id="msg" class="err"></span></p></div>`;
    prev();
  },
  async rep(){
    const y=new Date().getFullYear();
    $('#app').innerHTML=`<div class="card"><h3>Фінансова звітність</h3><div class="row"><div><label>Звітний період з</label><input id="f" type="date" value="${y}-01-01"></div><div><label>По (дата балансу)</label><input id="t" type="date" value="${y}-12-31"></div></div><p><button class="btn pri" onclick="reports()">Сформувати</button></p></div><div id="res"></div>`;
    reports();
  },
  async tasks(){
    TASKS=await api('tasks');const T=me.role==='teacher';
    $('#app').innerHTML=(T?`<div class="card"><h3>Нове завдання</h3><label>Назва</label><input id="tt"><label>Умова господарської операції</label><input id="td"><label>Правильні проводки</label><div id="ln">${lineRows(3)}</div><p><button class="btn pri" onclick="addTask()">Створити</button> <span id="msg" class="err"></span></p></div>`:'')+
    `<div class="card sc"><h3>Завдання</h3><table><tbody>${TASKS.map(t=>`<tr><td><b>${esc(t.title)}</b><br><span class="mut">${esc(t.description)}</span></td><td>${T?t.n+' відповідей':(t.done?'✅ виконано':t.tries?'спроб: '+t.tries:'')}</td><td>${T?`<button class="btn" onclick="subs(${t.id})">Відповіді</button> <button class="btn" onclick="delTask(${t.id})">✕</button>`:`<button class="btn pri" onclick="solve(${t.id})">Виконати</button>`}</td></tr>`).join('')||'<tr><td class="mut">Завдань ще немає</td></tr>'}</tbody></table></div><div id="res"></div>`;
  },
  async osv(){
    const y=new Date().getFullYear();
    $('#app').innerHTML=`<div class="card"><h3>Оборотно-сальдова відомість</h3><div class="row">
    <div><label>З</label><input id="f" type="date" value="${y}-01-01"></div>
    <div><label>По</label><input id="t" type="date" value="${y}-12-31"></div></div>
    <p><button class="btn pri" onclick="osv()">Сформувати</button></p></div><div id="res"></div>`;
    osv();
  },
  async plan(){
    $('#app').innerHTML=`<div class="card sc"><h3>План рахунків</h3><table><thead><tr><th>Код</th><th>Назва</th><th>Тип</th></tr></thead><tbody>
    ${accounts.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td>${{A:'Активний',P:'Пасивний',AP:'Активно-пасивний',O:'Позабалансовий'}[a.kind]}</td></tr>`).join('')}</tbody></table></div>`;
  }
};
async function addCo(){const name=$('#cn').value;try{const c=await api('companies',{method:'POST',body:{name}});pick(c.id,c.name)}catch(e){alert(e.message)}}
function pick(id,name){company={id,name};localStorage.setItem('company',JSON.stringify(company));go('entries')}
function prev(){
  const t=TPL[$('#tp').value],s=Number($('#amt').value)||0;
  $('#pv').innerHTML=`<table><thead><tr><th>Дт</th><th>Кт</th><th class="n">Сума</th></tr></thead><tbody>${t[2].map(([d,k,f])=>{
  const n=accounts.find(a=>a.code===d)?.name||'',m=accounts.find(a=>a.code===k)?.name||'';
  return `<tr data-d="${d}" data-k="${k}"><td>${d} <span class="mut">${esc(n)}</span></td><td>${k} <span class="mut">${esc(m)}</span></td><td class="n"><input class="la" type="number" step="0.01" value="${(s*f).toFixed(2)}" style="width:130px"></td></tr>`}).join('')}</tbody></table>`;
}
async function saveTpl(){
  const t=TPL[$('#tp').value];
  const lines=[...document.querySelectorAll('#pv tr[data-d]')].map(r=>({debit_acc:r.dataset.d,credit_acc:r.dataset.k,amount:r.querySelector('.la').value}));
  try{await api('entries',{method:'POST',body:{company_id:company.id,date:$('#d').value,doc:$('#doc').value,description:t[1],lines}});go('entries')}
  catch(e){$('#msg').textContent=e.message}
}
async function save(){
  try{await api('entries',{method:'POST',body:{company_id:company.id,date:$('#d').value,doc:$('#doc').value,description:$('#ds').value,debit_acc:$('#dt').value,credit_acc:$('#kt').value,amount:$('#amt').value}});go('entries')}
  catch(e){$('#msg').textContent=e.message}
}
async function del(id){if(confirm('Видалити операцію?')){await api(`entries/${id}?company_id=${company.id}`,{method:'DELETE'});go('entries')}}
async function osv(){
  const r=await api(`osv?company_id=${company.id}&from=${$('#f').value}&to=${$('#t').value}`);
  const side=(v,dt)=>v>0?(dt?fmt(v):''):(v<0?(dt?'':fmt(-v)):'');
  const cells=x=>`<td class="n">${side(x.opening,1)}</td><td class="n">${side(x.opening,0)}</td><td class="n">${fmt(x.debit)}</td><td class="n">${fmt(x.credit)}</td><td class="n">${side(x.closing,1)}</td><td class="n">${side(x.closing,0)}</td>`;
  const sum=a=>a.reduce((s,x)=>({opening:s.opening+x.opening,debit:s.debit+x.debit,credit:s.credit+x.credit,closing:s.closing+x.closing}),{opening:0,debit:0,credit:0,closing:0});
  const g={};r.forEach(x=>(g[x.code.slice(0,2)]??=[]).push(x));
  let body='';
  for(const k of Object.keys(g).sort()){
    const a=g[k];
    if(a.length===1&&a[0].code.length===2){body+=`<tr style="font-weight:700"><td>${k} ${esc(a[0].name)}</td>${cells(a[0])}</tr>`;continue}
    body+=`<tr style="font-weight:700;background:var(--bg)"><td>${k} ${esc(SYN[k]||'')}</td>${cells(sum(a))}</tr>`;
    body+=a.map(x=>`<tr><td style="padding-left:24px">${x.code} ${esc(x.name)}</td>${cells(x)}</tr>`).join('');
  }
  const T=sum(r);
  $('#res').innerHTML=`<div class="card sc"><table><thead><tr><th rowspan="2">Рахунок</th><th colspan="2" class="n">Сальдо на початок</th><th colspan="2" class="n">Обороти</th><th colspan="2" class="n">Сальдо на кінець</th></tr>
  <tr><th class="n">Дт</th><th class="n">Кт</th><th class="n">Дт</th><th class="n">Кт</th><th class="n">Дт</th><th class="n">Кт</th></tr></thead><tbody>${body}</tbody>
  <tfoot><tr><td>Разом</td><td class="n">${fmt(Math.max(T.opening,0))}</td><td class="n"></td><td class="n">${fmt(T.debit)}</td><td class="n">${fmt(T.credit)}</td><td></td><td></td></tr></tfoot></table></div>`;
}
function logout(){token=null;me=null;company=null;localStorage.removeItem('token');localStorage.removeItem('company');login()}
function login(){
  token=null;$('#nav').innerHTML='';$('#co').textContent='';
  $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3>Вхід</h3>
  <label>Логін</label><input id="lg" autocomplete="username"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password">
  <details><summary class="mut" style="margin-top:10px;cursor:pointer">Реєстрація нового користувача</summary>
  <label>Прізвище та ім’я</label><input id="nm"><label>Код викладача (лише для викладачів)</label><input id="tc"></details>
  <p><button class="btn pri" onclick="auth('login')">Увійти</button> <button class="btn" onclick="auth('register')">Зареєструватись</button></p><p id="msg" class="err"></p></div>`;
}
async function auth(m){
  try{const d=await api(m,{method:'POST',body:{login:$('#lg').value,password:$('#pw').value,name:$('#nm').value,teacher_code:$('#tc').value}});
  token=d.token;localStorage.setItem('token',token);boot()}catch(e){$('#msg').textContent=e.message}
}
async function boot(){
  if(!token)return login();
  try{me=await api('me');accounts=await api('accounts')}catch(e){return login()}
  go(company?'entries':'company');
}
const lineRows=n=>Array.from({length:n},()=>`<div class="row" style="grid-template-columns:1fr 1fr 140px;margin-bottom:6px"><select class="ld"><option value="">Дт…</option>${accOpts()}</select><select class="lk"><option value="">Кт…</option>${accOpts()}</select><input class="la2" type="number" step="0.01" min="0" placeholder="Сума"></div>`).join('');
const readLines=el=>[...el.querySelectorAll('.row')].map(r=>({debit_acc:r.querySelector('.ld').value,credit_acc:r.querySelector('.lk').value,amount:r.querySelector('.la2').value})).filter(l=>l.debit_acc&&l.credit_acc&&l.amount);
async function addTask(){try{await api('tasks',{method:'POST',body:{title:$('#tt').value,description:$('#td').value,lines:readLines($('#ln'))}});go('tasks')}catch(e){$('#msg').textContent=e.message}}
async function delTask(id){if(confirm('Видалити завдання та всі відповіді?')){await api('tasks/'+id,{method:'DELETE'});go('tasks')}}
function solve(id){const t=TASKS.find(x=>x.id===id);$('#res').innerHTML=`<div class="card"><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p><div id="ln">${lineRows(3)}</div><p><button class="btn pri" onclick="answer(${id})">Перевірити</button></p><p id="msg"></p></div>`;$('#res').scrollIntoView()}
async function answer(id){
  try{const r=await api(`tasks/${id}/answer`,{method:'POST',body:{lines:readLines($('#ln'))}});
  $('#msg').innerHTML=r.correct?'<b>✅ Правильно!</b> '+r.expected.map(l=>`Дт ${l.debit_acc} Кт ${l.credit_acc} ${fmt(l.amount)}`).join('; '):`<span class="err">❌ Невірно. Збігається проводок: ${r.matched} з ${r.total}. Спробуйте ще.</span>`}
  catch(e){$('#msg').textContent=e.message}
}
async function subs(id){
  const s=await api('submissions?task_id='+id);
  $('#res').innerHTML=`<div class="card sc"><h3>Відповіді студентів</h3><table><thead><tr><th>Студент</th><th>Час</th><th></th><th>Відповідь</th></tr></thead><tbody>${s.map(x=>`<tr><td>${esc(x.name)}</td><td>${String(x.created_at).slice(0,16).replace('T',' ')}</td><td>${x.correct?'✅':'❌'}</td><td>${x.answer.map(l=>`Дт ${l.debit_acc} Кт ${l.credit_acc} ${l.amount}`).join('; ')}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Відповідей немає</td></tr>'}</tbody></table></div>`;
}
async function reports(){
  const f=$('#f').value,t=$('#t').value;
  const [o,p]=await Promise.all([api(`osv?company_id=${company.id}&from=1900-01-01&to=${t}`),api(`pnl?company_id=${company.id}&from=${f}&to=${t}`)]);
  const S=(pf,sg=1)=>sg*o.filter(x=>pf.some(q=>x.code.startsWith(q))).reduce((s,x)=>s+x.closing,0);
  const tx=o.filter(x=>x.code==='641'||x.code==='642');
  const TP=tx.reduce((s,x)=>s+Math.max(x.closing,0),0),TN=tx.reduce((s,x)=>s-Math.min(x.closing,0),0);
  const R=-o.filter(x=>/^[789]/.test(x.code)&&!x.code.startsWith('79')).reduce((s,x)=>s+x.closing,0);
  const A=[['Нематеріальні активи',S(['12','133'])],['Основні засоби (залишкова вартість)',S(['10','11','131','132','135'])],['Інвестиції та капітальні вкладення',S(['14','15','134'])],['Інші необоротні активи',S(['16','17','18','19'])],['Запаси',S(['2'])],['Дебіторська заборгованість',S(['36','37','38','644'])],['Розрахунки з бюджетом (дебетове сальдо)',TP],['Гроші та їх еквіваленти',S(['30','31','33','34','35'])],['Витрати майбутніх періодів',S(['39'])]];
  const P=[['Власний капітал',S(['40','41','42','43','44','45','46','79'],-1)],['Результат періоду (рахунки 7–9 не закрито)',R],['Забезпечення та цільове фінансування',S(['47','48'],-1)],['Довгострокові зобов’язання',S(['5'],-1)],['Короткострокові позики',S(['60','61','62'],-1)],['Кредиторська заборгованість за товари, роботи, послуги',S(['63'],-1)],['Розрахунки з бюджетом і зі страхування',S(['643','65'],-1)+TN],['Розрахунки з оплати праці',S(['66'],-1)],['Інші поточні зобов’язання',S(['67','68'],-1)],['Доходи майбутніх періодів',S(['69'],-1)]];
  const tot=a=>a.reduce((s,x)=>s+x[1],0),ta=tot(A),tp=tot(P);
  const cr=(...q)=>p.filter(x=>q.some(z=>x.code.startsWith(z))).reduce((s,x)=>s+x.c-x.d,0),dr=(...q)=>-cr(...q);
  const rev=cr('70'),cogs=dr('90'),gp=rev-cogs,adm=dr('92'),sell=dr('93');
  const op=gp+cr('71')-adm-sell-dr('94'),pbt=op+cr('72','73')+cr('74')-dr('95')-dr('96')-dr('97'),tax=dr('98');
  const F=[['Чистий дохід від реалізації',rev],['Собівартість реалізації',-cogs],['Валовий прибуток (збиток)',gp],['Інший операційний дохід',cr('71')],['Адміністративні витрати',-adm],['Витрати на збут',-sell],['Інші операційні витрати',-dr('94')],['Фінансовий результат від операційної діяльності',op],['Фінансові та інші доходи',cr('72','73','74')],['Фінансові та інші витрати',-(dr('95')+dr('96')+dr('97'))],['Фінансовий результат до оподаткування',pbt],['Податок на прибуток',-tax],['Чистий прибуток (збиток)',pbt-tax]];
  const bold=n=>/^(Валовий|Фінансовий результат|Чистий прибуток)/.test(n);
  const tr=(n,v,b)=>`<tr${b||bold(n)?' style="font-weight:700"':''}><td>${n}</td><td class="n">${fmt(v)}</td></tr>`;
  $('#res').innerHTML=`<div class="card sc"><h3>Баланс (скорочений) на ${t}</h3><table><thead><tr><th>Актив</th><th class="n">Сума</th></tr></thead><tbody>${A.map(([n,v])=>tr(n,v)).join('')}${tr('Баланс (актив)',ta,1)}</tbody>
  <thead><tr><th>Пасив</th><th class="n"></th></tr></thead><tbody>${P.map(([n,v])=>tr(n,v)).join('')}${tr('Баланс (пасив)',tp,1)}</tbody></table>
  <p class="${Math.abs(ta-tp)<0.005?'mut':'err'}">${Math.abs(ta-tp)<0.005?'✓ Актив дорівнює пасиву':'Різниця актив – пасив: '+fmt(ta-tp)}</p></div>
  <div class="card sc"><h3>Звіт про фінансові результати за ${f} — ${t}</h3><table><tbody>${F.map(([n,v])=>tr(n,v)).join('')}</tbody></table></div>`;
}
boot();
</script></body></html>
