    <rect x="124" y="246" width="72" height="22" rx="11"/>
    <rect x="124" y="294" width="84" height="22" rx="11"/>
    <!-- кредит (праворуч) -->
    <g opacity=".6">
      <rect x="292" y="198" width="84" height="22" rx="11"/>
      <rect x="292" y="246" width="96" height="22" rx="11"/>
      <rect x="292" y="294" width="60" height="22" rx="11"/>
