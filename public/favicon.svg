      <stop offset="0" stop-color="#2a8de0"/>
      <stop offset="1" stop-color="#0b569b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <g fill="#fff">
